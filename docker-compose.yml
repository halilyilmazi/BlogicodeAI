services:
  mongo:
    image: mongo:7
    container_name: blogicode-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: blogicode-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  # REST API + statik web arayüzü (mobil uygulamanın ve web'in kullandığı gerçek backend)
  api:
    build:
      context: ./Halil-Yılmaz
      dockerfile: backend/Dockerfile
    container_name: blogicode-api
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGODB_URI=mongodb://mongo:27017/blogicode
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongo
      - redis
    restart: unless-stopped

volumes:
  mongo_data:
