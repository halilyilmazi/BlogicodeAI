<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlogicodeAI | Giriş & Kayıt</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .auth-box {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 320px;
            text-align: center;
            transition: all 0.3s ease;
        }
        .auth-box h2 {
            margin-bottom: 20px;
            color: #1877f2;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .hidden {
            display: none;
        }
        button {
            width: 100%;
            background-color: #1877f2;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #166fe5;
        }
        #statusMessage {
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
            min-height: 20px;
        }
        .toggle-link {
            margin-top: 20px;
            font-size: 14px;
            color: #555;
            cursor: pointer;
            text-decoration: underline;
        }
        .toggle-link:hover {
            color: #1877f2;
        }
    </style>
</head>
<body>

    <div class="auth-box">
        <h2 id="formTitle">Giriş Yap</h2>
        
        <input type="text" id="firstName" class="hidden" placeholder="Adınız" />
        <input type="text" id="lastName" class="hidden" placeholder="Soyadınız" />
        
        <input type="email" id="email" placeholder="E-posta Adresiniz" required />
        <input type="password" id="password" placeholder="Şifreniz" required />
        
        <button id="mainBtn" onclick="islemYap()">Giriş Yap</button>
        <p id="statusMessage"></p>
        
        <div class="toggle-link" onclick="formuDegistir()" id="toggleText">Hesabın yok mu? Kayıt Ol</div>
    </div>

    <script src="config.js"></script>
    <script>
        let isLoginMode = true; // Sayfa ilk açıldığında giriş modunda
        const apiUrl = window.BLOGICODE_API_BASE;

        // Formu Giriş/Kayıt arasında değiştirme fonksiyonu
        function formuDegistir() {
            isLoginMode = !isLoginMode;
            
            const title = document.getElementById('formTitle');
            const btn = document.getElementById('mainBtn');
            const toggle = document.getElementById('toggleText');
            const nameInput = document.getElementById('firstName');
            const surnameInput = document.getElementById('lastName');
            const msg = document.getElementById('statusMessage');
            
            msg.innerText = ""; // Mesajları temizle

            if(isLoginMode) {
                title.innerText = "Giriş Yap";
                btn.innerText = "Giriş Yap";
                toggle.innerText = "Hesabın yok mu? Kayıt Ol";
                nameInput.classList.add('hidden');
                surnameInput.classList.add('hidden');
            } else {
                title.innerText = "Kayıt Ol";
                btn.innerText = "Kayıt Ol";
                toggle.innerText = "Zaten hesabın var mı? Giriş Yap";
                nameInput.classList.remove('hidden');
                surnameInput.classList.remove('hidden');
            }
        }

        // Giriş veya Kayıt işlemini tetikleyen ana fonksiyon
        async function islemYap() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const firstName = document.getElementById('firstName').value;
            const lastName = document.getElementById('lastName').value;
            const messageText = document.getElementById('statusMessage');

            if (!email || !password) {
                messageText.style.color = "red";
                messageText.innerText = "Lütfen e-posta ve şifre girin.";
                return;
            }

            messageText.style.color = "#333";
            messageText.innerText = "İşlem yapılıyor, lütfen bekleyin...";

            try {
                // Mod neyse (login veya register) ona göre linki ve veriyi ayarlıyoruz
                const endpoint = isLoginMode ? '/auth/login' : '/auth/register';
                const bodyData = isLoginMode 
                    ? { email, password } 
                    : { firstName, lastName, email, password };

                const response = await fetch(apiUrl + endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(bodyData)
                });
                
                const data = await response.json();
                
                if(response.ok) {
                    messageText.style.color = "green";
                    if (isLoginMode) {
                        messageText.innerText = "Giriş Başarılı! Ana sayfaya yönlendiriliyorsunuz...";
                        // Başarılı girişte Token'ı ve ID'yi tarayıcı hafızasına kaydediyoruz (İleride lazım olacak)
                        localStorage.setItem('userToken', data.token);
                        localStorage.setItem('userId', data.user._id);
                        setTimeout(() => { window.location.href = 'index.html'; }, 1000);
                    } else {
                        messageText.innerText = "Kayıt Başarılı! Şimdi giriş yapabilirsiniz.";
                        setTimeout(() => formuDegistir(), 1500); // 1.5 saniye sonra giriş formuna at
                    }
                } else {
                    messageText.style.color = "red";
                    messageText.innerText = data.message || "Bir hata oluştu.";
                }
            } catch (error) {
                messageText.style.color = "red";
                messageText.innerText = "Sunucuya bağlanılamadı.";
            }
        }
    </script>

</body>
</html>
