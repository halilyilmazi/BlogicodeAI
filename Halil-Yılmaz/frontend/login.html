<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlogicodeAI | Giriş & Kayıt</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=DM+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
</head>
<body class="theme-auth-page">

    <div style="width:100%;max-width:400px;">
        <div class="theme-auth-back">
            <a href="index.html" class="btn-nav">← Keşfet</a>
        </div>
    <div class="theme-auth-card">
        <h2 id="formTitle">Giriş yap</h2>

        <input type="text" id="firstName" class="hidden" placeholder="Adın" autocomplete="given-name" />
        <input type="text" id="lastName" class="hidden" placeholder="Soyadın" autocomplete="family-name" />

        <input type="email" id="email" placeholder="E-posta" required autocomplete="email" />
        <input type="password" id="password" placeholder="Şifre" required autocomplete="current-password" />

        <button type="button" id="mainBtn" class="btn-auth" onclick="islemYap()">Giriş yap</button>
        <p id="statusMessage"></p>

        <div class="toggle-link" onclick="formuDegistir()" id="toggleText">Hesabın yok mu? Kayıt ol</div>
    </div>
    </div>

    <script src="config.js"></script>
    <script>
        let isLoginMode = true;
        const apiUrl = window.BLOGICODE_API_BASE;

        function formuDegistir() {
            isLoginMode = !isLoginMode;

            const title = document.getElementById('formTitle');
            const btn = document.getElementById('mainBtn');
            const toggle = document.getElementById('toggleText');
            const nameInput = document.getElementById('firstName');
            const surnameInput = document.getElementById('lastName');
            const msg = document.getElementById('statusMessage');

            msg.innerText = '';

            if (isLoginMode) {
                title.innerText = 'Giriş yap';
                btn.innerText = 'Giriş yap';
                toggle.innerText = 'Hesabın yok mu? Kayıt ol';
                nameInput.classList.add('hidden');
                surnameInput.classList.add('hidden');
            } else {
                title.innerText = 'Kayıt ol';
                btn.innerText = 'Kayıt ol';
                toggle.innerText = 'Zaten hesabın var mı? Giriş yap';
                nameInput.classList.remove('hidden');
                surnameInput.classList.remove('hidden');
            }
        }

        async function islemYap() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const firstName = document.getElementById('firstName').value;
            const lastName = document.getElementById('lastName').value;
            const messageText = document.getElementById('statusMessage');

            if (!email || !password) {
                messageText.style.color = '#f87171';
                messageText.innerText = 'Lütfen e-posta ve şifre gir.';
                return;
            }
            if (!isLoginMode && (!firstName.trim() || !lastName.trim())) {
                messageText.style.color = '#f87171';
                messageText.innerText = 'Kayıt için ad ve soyad gerekli.';
                return;
            }

            messageText.style.color = '#94a3b8';
            messageText.innerText = 'İşlem yapılıyor…';

            try {
                const endpoint = isLoginMode ? '/auth/login' : '/auth/register';
                const bodyData = isLoginMode
                    ? { email, password }
                    : { firstName, lastName, email, password };

                const response = await fetch(apiUrl + endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(bodyData)
                });

                const data = await response.json();

                if (response.ok) {
                    messageText.style.color = '#4ade80';
                    if (isLoginMode) {
                        messageText.innerText = 'Giriş başarılı! Yönlendiriliyorsun…';
                        localStorage.setItem('userToken', data.token);
                        localStorage.setItem('userId', String(data.user._id));
                        setTimeout(() => { window.location.href = 'index.html'; }, 800);
                    } else {
                        messageText.innerText = 'Kayıt başarılı! Giriş yapabilirsin.';
                        setTimeout(() => formuDegistir(), 1500);
                    }
                } else {
                    messageText.style.color = '#f87171';
                    messageText.innerText = data.message || 'Bir hata oluştu.';
                }
            } catch (error) {
                messageText.style.color = '#f87171';
                messageText.innerText = 'Sunucuya bağlanılamadı.';
            }
        }
    </script>
</body>
</html>
