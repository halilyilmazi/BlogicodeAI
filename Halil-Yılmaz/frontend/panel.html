<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlogicodeAI | Kullanıcı paneli</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=DM+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
    <style>
        #panelMsg { margin-top: 12px; font-weight: 600; min-height: 22px; }
    </style>
</head>
<body class="theme-body">
    <header class="theme-navbar">
        <div class="sky-layer" aria-hidden="true">
            <div class="stars"></div>
            <div class="twinkle"></div>
            <span class="plane" aria-hidden="true">✈</span>
            <span class="plane" aria-hidden="true">✈</span>
            <span class="plane" aria-hidden="true">✈</span>
        </div>
        <div class="navbar-inner">
            <div class="nav-left">
                <a href="index.html" class="brand-link">
                    <div class="brand-block">
                        <p class="brand-title">BlogicodeAI</p>
                        <p class="brand-sub">Kullanıcı paneli</p>
                    </div>
                </a>
            </div>
            <nav class="nav-actions" aria-label="Üst menü">
                <a href="index.html" class="btn-nav">Keşfet</a>
                <a href="chatbot.html" class="btn-nav btn-nav-assistant">
                    <img src="robot-celik.svg" alt="" class="nav-robot-icon" width="22" height="22">
                    Asistan
                </a>
                <button type="button" class="btn-nav btn-nav-primary" onclick="location.href='home.html'">Yeni yazı</button>
                <button type="button" class="btn-nav" onclick="cikis()">Çıkış</button>
            </nav>
        </div>
    </header>
    <nav class="theme-tabs" role="tablist">
        <button type="button" class="active" data-section="fav" role="tab">Favorilerim</button>
        <button type="button" data-section="posts" role="tab">Yazılarım</button>
        <button type="button" data-section="comments" role="tab">Yorumlarım</button>
        <button type="button" data-section="profil" role="tab">Profil bilgilerim</button>
    </nav>
    <main class="theme-main">
        <section id="sec-fav" class="panel-section active" aria-labelledby="tab-fav">
            <div id="favContainer"><p class="empty-hint">Yükleniyor...</p></div>
        </section>
        <section id="sec-posts" class="panel-section" aria-labelledby="tab-posts">
            <div id="myPostsContainer"><p class="empty-hint">Yükleniyor...</p></div>
        </section>
        <section id="sec-comments" class="panel-section" aria-labelledby="tab-comments">
            <div id="myCommentsContainer"><p class="empty-hint">Yükleniyor...</p></div>
        </section>
        <section id="sec-profil" class="panel-section" aria-labelledby="tab-profil">
            <div class="profile-shortcuts" style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;">
                <button type="button" class="btn btn-ghost" onclick="goPanelTab('posts')">Yazılarımı yönet</button>
                <button type="button" class="btn btn-ghost" onclick="goPanelTab('comments')">Yorumlarım</button>
            </div>
            <img id="imgPreview" src="https://api.dicebear.com/9.x/notionists-neutral/svg?seed=blogicode-unisex" class="profile-preview" alt="Önizleme">
            <div class="form-group">
                <label>Profil fotoğrafı yükle</label>
                <input type="file" id="profilePhotoFile" accept="image/*">
            </div>
            <div class="form-group">
                <label>Profil fotoğrafı URL (isteğe bağlı)</label>
                <input type="text" id="profilePhoto" placeholder="https://... veya yukarıdan dosya seç" oninput="syncPreviewFromUrl()">
            </div>
            <div style="display:flex;gap:12px;flex-wrap:wrap;">
                <div class="form-group" style="flex:1;min-width:140px;">
                    <label>Ad</label>
                    <input type="text" id="firstName">
                </div>
                <div class="form-group" style="flex:1;min-width:140px;">
                    <label>Soyad</label>
                    <input type="text" id="lastName">
                </div>
            </div>
            <div class="form-group">
                <label>Kullanıcı adı</label>
                <input type="text" id="username" placeholder="@kullanici">
            </div>
            <div class="form-group">
                <label>Meslek</label>
                <input type="text" id="profession">
            </div>
            <div style="display:flex;gap:12px;flex-wrap:wrap;">
                <div class="form-group" style="flex:1;min-width:140px;">
                    <label>Cinsiyet</label>
                    <select id="gender">
                        <option value="">Seçiniz</option>
                        <option value="Erkek">Erkek</option>
                        <option value="Kadın">Kadın</option>
                        <option value="Belirtmek İstemiyorum">Belirtmek İstemiyorum</option>
                    </select>
                </div>
                <div class="form-group" style="flex:1;min-width:140px;">
                    <label>Doğum tarihi</label>
                    <input type="date" id="birthDate">
                </div>
            </div>
            <div class="form-group">
                <label>Hakkımda</label>
                <textarea id="bio" rows="3"></textarea>
            </div>
            <button type="button" class="btn btn-primary" onclick="profilKaydet()">Kaydet</button>
            <p id="panelMsg"></p>
            <button type="button" class="btn btn-ghost btn-danger-ghost" style="margin-top:24px;width:100%;" onclick="openDeleteAccountModal()">Hesabımı sil</button>
        </section>
    </main>

    <div id="viewPostModal" class="modal-bg" aria-hidden="true">
        <div class="modal-box">
            <h3 id="viewPostTitle"></h3>
            <p id="viewPostMeta" class="meta"></p>
            <div id="viewPostBody" style="white-space:pre-wrap;color:#cbd5e1;font-size:14px;line-height:1.55;margin:14px 0;"></div>
            <button type="button" class="btn btn-primary" onclick="closeViewPostModal()">Kapat</button>
        </div>
    </div>

    <div id="deleteAccountModal" class="modal-bg" aria-hidden="true">
        <div class="modal-box" style="max-width:420px;">
            <h3>Hesabını sil</h3>
            <p style="margin:0;color:#cbd5e1;line-height:1.5;">Emin misin, seninle okuyup yazmak çok keyifliydi?</p>
            <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;">
                <button type="button" class="btn btn-ghost" onclick="closeDeleteAccountModal()">Vazgeç</button>
                <button type="button" class="btn btn-ghost" style="color:#f87171;" onclick="confirmDeleteAccount()">Evet :(</button>
            </div>
        </div>
    </div>

    <div id="editModal" class="modal-bg" aria-hidden="true">
        <div class="modal-box">
            <h3>Yazıyı düzenle</h3>
            <input type="hidden" id="editPostId">
            <div class="form-group">
                <label>Başlık</label>
                <input type="text" id="editTitle">
            </div>
            <div class="form-group">
                <label>Kategori</label>
                <input type="text" id="editCategory">
            </div>
            <div class="form-group">
                <label>İçerik</label>
                <textarea id="editContent" rows="8"></textarea>
            </div>
            <div style="display:flex;gap:10px;flex-wrap:wrap;">
                <button type="button" class="btn btn-primary" onclick="yaziGuncelleKaydet()">Kaydet</button>
                <button type="button" class="btn btn-ghost" onclick="closeEditModal()">İptal</button>
            </div>
            <p id="editMsg" style="margin-top:10px;font-weight:600;"></p>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        const apiUrl = window.BLOGICODE_API_BASE;
        const DEFAULT_AVATAR = 'https://api.dicebear.com/9.x/notionists-neutral/svg?seed=blogicode-unisex';
        const userId = localStorage.getItem('userId');
        if (!userId) window.location.href = 'index.html';

        function goPanelTab(section) {
            const tab = document.querySelector('.theme-tabs button[data-section="' + section + '"]');
            if (tab) tab.click();
        }

        function syncPreviewFromUrl() {
            const v = document.getElementById('profilePhoto').value.trim();
            document.getElementById('imgPreview').src = v || DEFAULT_AVATAR;
        }

        document.getElementById('profilePhotoFile').addEventListener('change', (e) => {
            const f = e.target.files && e.target.files[0];
            if (!f) return;
            if (f.size > 1.5 * 1024 * 1024) {
                alert('Görsel 1,5 MB sınırını aşıyor. Lütfen daha küçük bir dosya seç.');
                e.target.value = '';
                return;
            }
            const r = new FileReader();
            r.onload = () => {
                document.getElementById('profilePhoto').value = r.result;
                document.getElementById('imgPreview').src = r.result;
            };
            r.readAsDataURL(f);
        });

        document.querySelectorAll('.theme-tabs button').forEach((btn) => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.theme-tabs button').forEach((b) => b.classList.remove('active'));
                document.querySelectorAll('.panel-section').forEach((s) => s.classList.remove('active'));
                btn.classList.add('active');
                const id = 'sec-' + btn.dataset.section;
                const el = document.getElementById(id);
                if (el) el.classList.add('active');
                history.replaceState(null, '', '#' + btn.dataset.section);
                if (btn.dataset.section === 'comments') loadMyComments();
            });
        });

        function applyHash() {
            const h = (location.hash || '#fav').slice(1);
            const map = { fav: 'fav', posts: 'posts', comments: 'comments', profil: 'profil' };
            const key = map[h] || 'fav';
            const tab = document.querySelector('.theme-tabs button[data-section="' + key + '"]');
            if (tab) tab.click();
        }

        async function loadFavorites() {
            const box = document.getElementById('favContainer');
            try {
                const res = await fetch(apiUrl + '/users/' + userId + '/favorites');
                const json = await res.json();
                const posts = json.data || [];
                if (!posts.length) {
                    box.innerHTML = '<p class="empty-hint">Henüz favoriye eklediğin yazı yok. Keşfet sayfasından ⭐ ile ekleyebilirsin.</p>';
                    return;
                }
                const byCat = {};
                posts.forEach((p) => {
                    const c = (p.category && p.category.trim()) ? p.category.trim() : 'Genel';
                    if (!byCat[c]) byCat[c] = [];
                    byCat[c].push(p);
                });
                const cats = Object.keys(byCat).sort((a, b) => a.localeCompare(b, 'tr'));
                box.innerHTML = cats.map((cat) => {
                    const items = byCat[cat].map((p) => `
                        <div class="fav-card">
                            <h4>${escapeHtml(p.title)}</h4>
                            <p>${escapeHtml(p.content)}</p>
                        </div>
                    `).join('');
                    return `<div class="cat-group"><h3>${escapeHtml(cat)}</h3>${items}</div>`;
                }).join('');
            } catch (e) {
                box.innerHTML = '<p class="empty-hint" style="color:#f87171;">Favoriler yüklenemedi.</p>';
            }
        }

        async function loadMyPosts() {
            const box = document.getElementById('myPostsContainer');
            try {
                const res = await fetch(apiUrl + '/users/' + userId);
                const data = await res.json();
                const posts = data.posts || [];
                if (!posts.length) {
                    box.innerHTML = '<p class="empty-hint">Henüz yazın yok. «Yeni yazı paylaş» ile başlayabilirsin.</p>';
                    return;
                }
                box.innerHTML = posts.map((p) => {
                    const d = new Date(p.createdAt).toLocaleDateString('tr-TR');
                    return `
                        <div class="post-row" id="row-${p._id}">
                            <div>
                                <h4>${escapeHtml(p.title)}</h4>
                                <div class="meta">${escapeHtml(p.category || 'Genel')} · ${d}</div>
                            </div>
                            <div class="post-row-actions">
                                <button type="button" class="btn btn-ghost" onclick="openViewPostModal('${p._id}')">Görüntüle</button>
                                <button type="button" class="btn btn-ghost" onclick="openEditModal('${p._id}')">Düzenle</button>
                                <button type="button" class="btn btn-ghost" style="color:#f87171;" onclick="silYazi('${p._id}')">Sil</button>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (e) {
                box.innerHTML = '<p class="empty-hint" style="color:#f87171;">Yazılar yüklenemedi.</p>';
            }
        }

        async function openViewPostModal(id) {
            try {
                const res = await fetch(apiUrl + '/users/' + userId);
                const data = await res.json();
                const posts = data.posts || [];
                const p = posts.find((x) => String(x._id) === String(id));
                if (!p) return;
                document.getElementById('viewPostTitle').textContent = p.title || '';
                document.getElementById('viewPostMeta').textContent = (p.category || 'Genel') + ' · ' + new Date(p.createdAt).toLocaleDateString('tr-TR');
                document.getElementById('viewPostBody').textContent = p.content || '';
                document.getElementById('viewPostModal').classList.add('open');
            } catch (e) {
                alert('Yazı yüklenemedi.');
            }
        }
        function closeViewPostModal() {
            document.getElementById('viewPostModal').classList.remove('open');
        }
        document.getElementById('viewPostModal').addEventListener('click', (e) => {
            if (e.target.id === 'viewPostModal') closeViewPostModal();
        });

        async function loadMyComments() {
            const box = document.getElementById('myCommentsContainer');
            box.innerHTML = '<p class="empty-hint">Yükleniyor...</p>';
            try {
                const res = await fetch(apiUrl + '/users/' + userId + '/comments');
                const json = await res.json();
                const arr = json.data || [];
                if (!arr.length) {
                    box.innerHTML = '<p class="empty-hint">Henüz yorumun yok. Keşfet sayfasından yazılara yorum bırakabilirsin.</p>';
                    return;
                }
                box.innerHTML = arr.map((c) => {
                    const d = new Date(c.createdAt).toLocaleDateString('tr-TR');
                    const cid = c._id;
                    return `
                        <div class="post-row" id="crow-${cid}">
                            <div>
                                <h4>${escapeHtml(c.postTitle)}</h4>
                                <div class="meta">${d}</div>
                                <p style="margin:8px 0 0;font-size:14px;color:#cbd5e1;line-height:1.5;">${escapeHtml(c.content)}</p>
                            </div>
                            <div class="post-row-actions">
                                <button type="button" class="btn btn-ghost" style="color:#f87171;" onclick="silYorum('${cid}')">Sil</button>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (e) {
                box.innerHTML = '<p class="empty-hint" style="color:#f87171;">Yorumlar yüklenemedi.</p>';
            }
        }

        async function silYorum(id) {
            if (!confirm('Bu yorumu silmek istediğine emin misin?')) return;
            try {
                const res = await fetch(apiUrl + '/comments/' + id + '?authorId=' + encodeURIComponent(userId), { method: 'DELETE' });
                if (res.ok || res.status === 204) {
                    const row = document.getElementById('crow-' + id);
                    if (row) row.remove();
                    const box = document.getElementById('myCommentsContainer');
                    if (box && !box.querySelector('.post-row')) {
                        box.innerHTML = '<p class="empty-hint">Henüz yorumun yok. Keşfet sayfasından yazılara yorum bırakabilirsin.</p>';
                    }
                } else {
                    const data = await res.json().catch(() => ({}));
                    alert(data.message || 'Silinemedi.');
                }
            } catch (e) {
                alert('Sunucu hatası.');
            }
        }

        async function openEditModal(id) {
            try {
                const res = await fetch(apiUrl + '/users/' + userId);
                const data = await res.json();
                const posts = data.posts || [];
                const p = posts.find((x) => String(x._id) === String(id));
                if (!p) return;
                document.getElementById('editPostId').value = id;
                document.getElementById('editTitle').value = p.title || '';
                document.getElementById('editCategory').value = p.category || '';
                document.getElementById('editContent').value = p.content || '';
                document.getElementById('editMsg').textContent = '';
                document.getElementById('editModal').classList.add('open');
            } catch (e) {
                alert('Yazı bilgisi alınamadı.');
            }
        }
        function closeEditModal() {
            document.getElementById('editModal').classList.remove('open');
        }
        document.getElementById('editModal').addEventListener('click', (e) => {
            if (e.target.id === 'editModal') closeEditModal();
        });

        async function yaziGuncelleKaydet() {
            const id = document.getElementById('editPostId').value;
            const msg = document.getElementById('editMsg');
            msg.textContent = 'Kaydediliyor...';
            msg.style.color = '#94a3b8';
            try {
                const res = await fetch(apiUrl + '/posts/' + id, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        title: document.getElementById('editTitle').value,
                        category: document.getElementById('editCategory').value,
                        content: document.getElementById('editContent').value,
                        authorId: userId
                    })
                });
                const data = await res.json().catch(() => ({}));
                if (res.ok) {
                    msg.style.color = '#4ade80';
                    msg.textContent = 'Güncellendi.';
                    closeEditModal();
                    loadMyPosts();
                } else {
                    msg.style.color = '#f87171';
                    msg.textContent = data.message || 'Kaydedilemedi.';
                }
            } catch (e) {
                msg.style.color = '#f87171';
                msg.textContent = 'Bağlantı hatası.';
            }
        }

        async function silYazi(id) {
            if (!confirm('Bu yazıyı silmek istediğine emin misin?')) return;
            try {
                const res = await fetch(apiUrl + '/posts/' + id + '?authorId=' + encodeURIComponent(userId), { method: 'DELETE' });
                if (res.ok || res.status === 204) {
                    const row = document.getElementById('row-' + id);
                    if (row) row.remove();
                } else {
                    const data = await res.json().catch(() => ({}));
                    alert(data.message || 'Silinemedi.');
                }
            } catch (e) {
                alert('Sunucu hatası.');
            }
        }

        async function loadProfile() {
            try {
                const res = await fetch(apiUrl + '/users/' + userId);
                const data = await res.json();
                const u = data.user || data;
                document.getElementById('firstName').value = u.firstName || '';
                document.getElementById('lastName').value = u.lastName || '';
                document.getElementById('username').value = u.username || '';
                document.getElementById('profession').value = u.profession || '';
                document.getElementById('gender').value = u.gender || '';
                document.getElementById('birthDate').value = u.birthDate || '';
                document.getElementById('bio').value = u.bio || '';
                document.getElementById('profilePhoto').value = u.profilePhoto || '';
                const prev = document.getElementById('imgPreview');
                prev.src = (u.profilePhoto && String(u.profilePhoto).trim()) ? String(u.profilePhoto).trim() : DEFAULT_AVATAR;
            } catch (e) { console.error(e); }
        }

        async function profilKaydet() {
            const msg = document.getElementById('panelMsg');
            msg.style.color = '#94a3b8';
            msg.textContent = 'Kaydediliyor...';
            const body = {
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                username: document.getElementById('username').value,
                profession: document.getElementById('profession').value,
                gender: document.getElementById('gender').value,
                birthDate: document.getElementById('birthDate').value,
                bio: document.getElementById('bio').value,
                profilePhoto: document.getElementById('profilePhoto').value
            };
            try {
                const res = await fetch(apiUrl + '/users/' + userId, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                if (res.ok) {
                    msg.style.color = '#4ade80';
                    msg.textContent = 'Profil güncellendi.';
                } else {
                    msg.style.color = '#f87171';
                    msg.textContent = 'Güncellenemedi.';
                }
            } catch (e) {
                msg.style.color = '#f87171';
                msg.textContent = 'Bağlantı hatası.';
            }
        }

        function openDeleteAccountModal() {
            document.getElementById('deleteAccountModal').classList.add('open');
        }
        function closeDeleteAccountModal() {
            document.getElementById('deleteAccountModal').classList.remove('open');
        }
        document.getElementById('deleteAccountModal').addEventListener('click', (e) => {
            if (e.target.id === 'deleteAccountModal') closeDeleteAccountModal();
        });

        async function confirmDeleteAccount() {
            try {
                const res = await fetch(apiUrl + '/users/' + userId, { method: 'DELETE' });
                if (!res.ok && res.status !== 204) {
                    const data = await res.json().catch(() => ({}));
                    alert(data.error || data.message || 'Hesap silinemedi. Tekrar dene.');
                    return;
                }
            } catch (e) {
                alert('Sunucuya ulaşılamadı. İnternetini kontrol et.');
                return;
            }
            localStorage.clear();
            closeDeleteAccountModal();
            window.location.href = 'index.html';
        }

        function cikis() {
            localStorage.removeItem('userId');
            localStorage.removeItem('userToken');
            window.location.href = 'index.html';
        }

        function escapeHtml(s) {
            if (s == null) return '';
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        window.addEventListener('hashchange', applyHash);
        window.onload = () => {
            loadFavorites();
            loadMyPosts();
            loadProfile();
            applyHash();
        };
    </script>
</body>
</html>
