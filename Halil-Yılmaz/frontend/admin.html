<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlogicodeAI | Yönetici Paneli</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #212529; color: white; margin: 0; }
        .navbar { background-color: #343a40; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #1877f2; }
        .navbar button { background: #1877f2; color: white; border: none; padding: 8px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .container { max-width: 1000px; margin: 40px auto; padding: 0 15px; }
        table { width: 100%; border-collapse: collapse; background: #343a40; border-radius: 10px; overflow: hidden; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #495057; }
        th { background-color: #1877f2; color: white; }
        tr:hover { background-color: #495057; }
        .badge { background: #28a745; padding: 5px 10px; border-radius: 15px; font-size: 12px; }
        .delete-btn { background: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="navbar">
        <h1>🛡️ Sistem Kontrol Merkezi</h1>
        <button onclick="window.location.href='home.html'">Ana Sayfaya Dön</button>
    </div>

    <div class="container">
        <h2>Kayıtlı Kullanıcılar</h2>
        <table>
            <thead>
                <tr>
                    <th>Kullanıcı Adı</th>
                    <th>Ad Soyad</th>
                    <th>E-Posta</th>
                    <th>Kayıt Tarihi</th>
                    <th>İşlem</th>
                </tr>
            </thead>
            <tbody id="userTableBody">
                <tr><td colspan="5">Kullanıcılar yükleniyor...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const apiUrl = 'https://blogicode-ai.vercel.app/api';

        window.onload = async () => {
            const tableBody = document.getElementById('userTableBody');
            try {
                const res = await fetch(apiUrl + '/users');
                const users = await res.json();
                
                tableBody.innerHTML = ''; // Yükleniyor yazısını sil

                users.forEach(user => {
                    const date = new Date(user.createdAt).toLocaleDateString('tr-TR');
                    tableBody.innerHTML += `
                        <tr id="user-${user._id}">
                            <td><strong>${user.username || 'Belirtilmedi'}</strong></td>
                            <td>${user.firstName} ${user.lastName}</td>
                            <td>${user.email}</td>
                            <td><span class="badge">${date}</span></td>
                            <td><button class="delete-btn" onclick="kullaniciSil('${user._id}')">Kov (Sil)</button></td>
                        </tr>
                    `;
                });
            } catch (error) {
                tableBody.innerHTML = '<tr><td colspan="5" style="color:red;">Veriler çekilemedi!</td></tr>';
            }
        };

        async function kullaniciSil(id) {
            if(confirm("Bu kullanıcıyı sistemden sonsuza dek silmek istiyor musun?")) {
                try {
                    await fetch(apiUrl + '/users/' + id, { method: 'DELETE' });
                    document.getElementById('user-' + id).remove();
                    alert("Kullanıcı sistemden temizlendi!");
                } catch (error) {
                    alert("Silme işlemi başarısız.");
                }
            }
        }
    </script>
</body>
</html>
