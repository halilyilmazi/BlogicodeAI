<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlogicodeAI | Yönetici</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=DM+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
</head>
<body class="theme-body">

    <header class="theme-navbar">
        <div class="sky-layer" aria-hidden="true">
            <div class="stars"></div>
            <div class="twinkle"></div>
            <span class="plane" aria-hidden="true">✈</span>
            <span class="plane" aria-hidden="true">✈</span>
            <span class="plane" aria-hidden="true">✈</span>
        </div>
        <div class="navbar-inner">
            <div class="nav-left">
                <a href="index.html" class="brand-link">
                    <div class="brand-block">
                        <p class="brand-title">Yönetici</p>
                        <p class="brand-sub">Kullanıcı listesi</p>
                    </div>
                </a>
            </div>
            <nav class="nav-actions">
                <a href="index.html" class="btn-nav">Keşfet</a>
                <a href="home.html" class="btn-nav btn-nav-primary">Yeni yazı</a>
            </nav>
        </div>
    </header>

    <main class="theme-main theme-main--wide">
        <h1 class="theme-page-title">Kayıtlı kullanıcılar</h1>
        <p class="theme-page-sub">Dikkat: silinen kullanıcı geri alınamaz.</p>

        <div class="theme-table-wrap">
            <table class="theme-table">
                <thead>
                    <tr>
                        <th>Kullanıcı adı</th>
                        <th>Ad soyad</th>
                        <th>E-posta</th>
                        <th>Kayıt</th>
                        <th>İşlem</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <tr><td colspan="5" class="empty-hint">Yükleniyor…</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="config.js"></script>
    <script>
        const apiUrl = window.BLOGICODE_API_BASE;

        function escapeHtml(s) {
            if (s == null) return '';
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        window.onload = async () => {
            const tableBody = document.getElementById('userTableBody');
            try {
                const res = await fetch(apiUrl + '/users');
                const users = await res.json();

                tableBody.innerHTML = '';

                if (!Array.isArray(users) || users.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="5" class="empty-hint">Kayıtlı kullanıcı yok.</td></tr>';
                    return;
                }

                users.forEach(user => {
                    const date = new Date(user.createdAt).toLocaleDateString('tr-TR');
                    tableBody.innerHTML += `
                        <tr id="user-${user._id}">
                            <td><strong>${escapeHtml(user.username || '—')}</strong></td>
                            <td>${escapeHtml(user.firstName)} ${escapeHtml(user.lastName)}</td>
                            <td>${escapeHtml(user.email)}</td>
                            <td><span class="theme-badge">${escapeHtml(date)}</span></td>
                            <td><button type="button" class="btn-sm-danger" onclick="kullaniciSil('${user._id}')">Sil</button></td>
                        </tr>
                    `;
                });
            } catch (error) {
                tableBody.innerHTML = '<tr><td colspan="5" style="color:#f87171;">Veriler çekilemedi.</td></tr>';
            }
        };

        async function kullaniciSil(id) {
            if (!confirm('Bu kullanıcıyı kalıcı olarak silmek istiyor musun?')) return;
            try {
                await fetch(apiUrl + '/users/' + id, { method: 'DELETE' });
                const row = document.getElementById('user-' + id);
                if (row) row.remove();
                alert('Kullanıcı silindi.');
            } catch (error) {
                alert('Silme işlemi başarısız.');
            }
        }
    </script>
</body>
</html>
