<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlogicodeAI | Yeni yazı</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=DM+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
</head>
<body class="theme-body">

    <header class="theme-navbar">
        <div class="sky-layer" aria-hidden="true">
            <div class="stars"></div>
            <div class="twinkle"></div>
            <span class="plane" aria-hidden="true">✈</span>
            <span class="plane" aria-hidden="true">✈</span>
            <span class="plane" aria-hidden="true">✈</span>
        </div>
        <div class="navbar-inner">
            <div class="nav-left">
                <a href="index.html" class="brand-link">
                    <div class="brand-block">
                        <p class="brand-title">BlogicodeAI</p>
                        <p class="brand-sub">Bilişim etkileşim platformu</p>
                    </div>
                </a>
            </div>
            <nav class="nav-actions" aria-label="Üst menü">
                <a href="index.html" class="btn-nav">Keşfet</a>
                <a href="panel.html" class="btn-nav">Panelim</a>
                <a href="chatbot.html" class="btn-nav btn-nav-assistant">
                    <img src="robot-celik.svg" alt="" class="nav-robot-icon" width="22" height="22">
                    Asistan
                </a>
                <button type="button" class="btn-nav btn-nav-primary" onclick="cikisYap()">Çıkış</button>
            </nav>
        </div>
    </header>

    <main class="theme-main theme-main--narrow">
        <h1 class="theme-page-title">Yeni yazı paylaş</h1>
        <p class="theme-page-sub">Topluluğa düşüncelerini ve notlarını ekle.</p>

        <div class="theme-card">
            <h3 style="margin-top:0;">İçeriğini yaz</h3>
            <div class="form-group">
                <label for="postTitle">Başlık</label>
                <input type="text" id="postTitle" placeholder="Yazı başlığı" required>
            </div>
            <div class="form-group">
                <label for="postCategory">Kategori</label>
                <input type="text" id="postCategory" placeholder="Örn. Yazılım, Yapay zeka" required>
            </div>
            <div class="form-group">
                <label for="postContent">İçerik</label>
                <textarea id="postContent" rows="5" placeholder="Neler düşünüyorsun?" required></textarea>
            </div>
            <button type="button" class="btn btn-primary" onclick="yaziPaylas()">Paylaş</button>
            <span id="postMessage" style="margin-left:12px;font-weight:600;font-size:14px;"></span>
        </div>

        <h2 class="theme-section-heading">Son yazılar</h2>
        <div id="blogList">
            <p class="empty-hint">Yazılar yükleniyor…</p>
        </div>
    </main>

    <script src="config.js"></script>
    <script>
        const apiUrl = window.BLOGICODE_API_BASE;

        const userId = localStorage.getItem('userId');
        if (!userId) {
            window.location.href = 'index.html';
        }

        window.onload = yazilariGetir;

        async function yazilariGetir() {
            const blogListDiv = document.getElementById('blogList');
            try {
                const response = await fetch(apiUrl + '/posts');
                const result = await response.json();

                blogListDiv.innerHTML = '';

                if (!result.data || result.data.length === 0) {
                    blogListDiv.innerHTML = '<p class="empty-hint">Henüz hiç yazı paylaşılmamış. İlk yazan sen ol!</p>';
                    return;
                }

                result.data.forEach(post => {
                    const date = new Date(post.createdAt).toLocaleString('tr-TR');
                    const likes = post.likeCount != null ? post.likeCount : 0;
                    const favs = post.favoriteCount != null ? post.favoriteCount : 0;
                    const commentCount = post.commentCount != null ? post.commentCount : 0;

                    const deleteBtnHtml = (post.authorId === userId)
                        ? `<button type="button" class="delete-btn" onclick="yaziSil('${post._id}')">Yazıyı sil</button>`
                        : '';

                    const postHTML = `
                        <div class="blog-card" id="post-${post._id}">
                            <h3>${escapeHtml(post.title)}</h3>
                            <span class="category">${escapeHtml(post.category || 'Genel')}</span>
                            <div class="content">${escapeHtml(post.content)}</div>
                            <div class="post-reactions">
                                <button type="button" onclick="reaksiyonGonder('${post._id}','like')">❤️ Beğen<span class="count" id="like-c-${post._id}">${likes}</span></button>
                                <button type="button" onclick="reaksiyonGonder('${post._id}','favorite')">⭐ Favori<span class="count" id="fav-c-${post._id}">${favs}</span></button>
                                <span style="font-size:13px;color:#94a3b8;align-self:center;">💬 ${commentCount} yorum</span>
                            </div>
                            ${deleteBtnHtml}
                            <div class="date">${date}</div>
                            <div class="comment-section">
                                <input type="text" id="comment-${post._id}" class="comment-input" placeholder="Yorum yaz...">
                                <button type="button" class="comment-btn" onclick="yorumGonder('${post._id}')">Gönder</button>
                            </div>
                            <div id="comments-list-${post._id}"></div>
                            <div style="clear:both;"></div>
                        </div>
                    `;
                    blogListDiv.innerHTML += postHTML;
                });

            } catch (error) {
                blogListDiv.innerHTML = '<p class="empty-hint" style="color:#f87171;">Yazılar yüklenirken bir hata oluştu.</p>';
            }
        }

        function escapeHtml(s) {
            if (s == null) return '';
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        async function yaziPaylas() {
            const title = document.getElementById('postTitle').value;
            const category = document.getElementById('postCategory').value;
            const content = document.getElementById('postContent').value;
            const messageSpan = document.getElementById('postMessage');

            if (!title || !content) {
                messageSpan.style.color = '#f87171';
                messageSpan.innerText = 'Başlık ve içerik boş olamaz!';
                return;
            }

            messageSpan.style.color = '#94a3b8';
            messageSpan.innerText = 'Paylaşılıyor...';

            try {
                const response = await fetch(apiUrl + '/posts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, category, content, authorId: userId })
                });

                if (response.ok) {
                    messageSpan.style.color = '#4ade80';
                    messageSpan.innerText = 'Başarıyla paylaşıldı!';
                    document.getElementById('postTitle').value = '';
                    document.getElementById('postCategory').value = '';
                    document.getElementById('postContent').value = '';
                    yazilariGetir();
                    setTimeout(() => { messageSpan.innerText = ''; }, 2000);
                } else {
                    messageSpan.style.color = '#f87171';
                    messageSpan.innerText = 'Paylaşılamadı.';
                }
            } catch (error) {
                messageSpan.style.color = '#f87171';
                messageSpan.innerText = 'Sunucu hatası.';
            }
        }

        async function yaziSil(postId) {
            if (!confirm('Bu yazıyı kalıcı olarak silmek istiyor musun?')) return;
            try {
                const res = await fetch(apiUrl + '/posts/' + postId + '?authorId=' + encodeURIComponent(userId), { method: 'DELETE' });
                if (res.ok || res.status === 204) {
                    const el = document.getElementById('post-' + postId);
                    if (el) el.remove();
                } else {
                    const d = await res.json().catch(() => ({}));
                    alert(d.message || 'Silinemedi.');
                }
            } catch (error) {
                alert('Sunucu hatası, silinemedi.');
            }
        }

        async function yorumGonder(postId) {
            const commentInput = document.getElementById('comment-' + postId);
            const text = commentInput.value;

            if (!text) {
                alert('Lütfen bir yorum yazın!');
                return;
            }

            try {
                const res = await fetch(apiUrl + '/posts/' + postId + '/comments', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: text, authorId: userId })
                });

                if (res.ok) {
                    const commentsList = document.getElementById('comments-list-' + postId);
                    commentsList.innerHTML += `<div class="comment-item"><strong>Sen:</strong> ${escapeHtml(text)}</div>`;
                    commentInput.value = '';
                } else {
                    alert('Yorum gönderilirken bir hata oluştu.');
                }
            } catch (error) {
                alert('Sunucuya bağlanılamadı.');
            }
        }

        async function reaksiyonGonder(postId, action) {
            try {
                const res = await fetch(apiUrl + '/posts/' + postId + '/react', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId, action })
                });
                const data = await res.json().catch(() => ({}));
                if (res.ok && data.post) {
                    const l = document.getElementById('like-c-' + postId);
                    const f = document.getElementById('fav-c-' + postId);
                    if (l) l.textContent = data.post.likeCount != null ? data.post.likeCount : 0;
                    if (f) f.textContent = data.post.favoriteCount != null ? data.post.favoriteCount : 0;
                } else if (res.status === 200 && data.message === 'Zaten işaretli.') {
                    /* sessiz */
                } else {
                    alert(data.message || 'İşlem yapılamadı.');
                }
            } catch (e) {
                alert('Sunucuya bağlanılamadı.');
            }
        }

        function cikisYap() {
            localStorage.removeItem('userId');
            localStorage.removeItem('userToken');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
