<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlogicodeAI | Keşfet</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; }
        
        /* Teknolojik Navbar */
        .navbar { background: rgba(15, 23, 42, 0.9); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; position: sticky; top: 0; backdrop-filter: blur(10px); z-index: 100; }
        .navbar h1 { margin: 0; font-size: 24px; background: linear-gradient(90deg, #3b82f6, #8b5cf6); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        
        .nav-actions { display: flex; align-items: center; gap: 15px; }
        .btn-login { background: linear-gradient(90deg, #3b82f6, #2563eb); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4); }
        .profile-pic { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 2px solid #3b82f6; cursor: pointer; transition: 0.3s; }
        .profile-pic:hover { transform: scale(1.1); box-shadow: 0 0 15px rgba(59, 130, 246, 0.6); }
        
        /* Karşılama Ekranı (Hero) */
        .hero { text-align: center; padding: 70px 20px; background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%); border-bottom: 1px solid #1e293b; }
        .hero h2 { font-size: 38px; margin-bottom: 10px; color: #f8fafc; }
        .hero p { color: #94a3b8; font-size: 18px; margin-bottom: 25px; }
        .btn-write { background: #8b5cf6; color: white; border: none; padding: 12px 25px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.3s; }
        .btn-write:hover { background: #7c3aed; box-shadow: 0 4px 15px rgba(139, 92, 246, 0.5); }

        /* Blog Akışı */
        .container { max-width: 800px; margin: 40px auto; padding: 0 15px; }
        .post-card { background: #1e293b; padding: 25px; border-radius: 12px; margin-bottom: 25px; border: 1px solid #334155; transition: 0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .post-card:hover { border-color: #475569; transform: translateY(-3px); box-shadow: 0 8px 15px rgba(0,0,0,0.2); }
        
        .post-header { display: flex; justify-content: space-between; margin-bottom: 15px; color: #94a3b8; font-size: 13px; }
        .post-title { font-size: 24px; color: #f8fafc; margin: 0 0 10px 0; }
        .post-category { background: rgba(59, 130, 246, 0.15); color: #60a5fa; padding: 5px 12px; border-radius: 20px; font-size: 12px; display: inline-block; margin-bottom: 15px; border: 1px solid rgba(59, 130, 246, 0.3); }
        .post-content { color: #cbd5e1; line-height: 1.7; margin-bottom: 20px; font-size: 15px; }
        
        /* Fake İstatistikler ve Yönlendirme Alanı */
        .post-stats { display: flex; gap: 25px; border-top: 1px solid #334155; padding-top: 15px; }
        .stat-item { display: flex; align-items: center; gap: 8px; color: #94a3b8; cursor: pointer; transition: 0.2s; font-size: 14px; font-weight: bold; }
        .stat-item:hover { color: #3b82f6; }
        
        .comment-fake { background: #0f172a; padding: 12px 15px; border-radius: 8px; margin-top: 15px; font-size: 13px; color: #94a3b8; border-left: 3px solid #475569; display: flex; align-items: center; justify-content: space-between;}
        .comment-fake button { background: transparent; border: 1px solid #475569; color: #cbd5e1; padding: 5px 10px; border-radius: 5px; cursor: pointer; transition: 0.2s;}
        .comment-fake button:hover { background: #475569; color: white; }
    </style>
</head>
<body>

    <div class="navbar">
        <h1>BlogicodeAI</h1>
        <div class="nav-actions" id="navActions">
            </div>
    </div>

    <div class="hero">
        <h2>Teknoloji ve Yapay Zeka Dünyasını Keşfet</h2>
        <p>İçerik üreticilerine katıl, asistanla projeler geliştir, geleceği yakala.</p>
        <button class="btn-write" onclick="islemYap()">🚀 Hemen Üretmeye Başla</button>
    </div>

    <div class="container" id="publicFeed">
        <h3 style="color: #f8fafc; margin-bottom: 25px; border-bottom: 2px solid #3b82f6; padding-bottom: 10px; display: inline-block;">🔥 En Güncel Akış</h3>
        <p>Veritabanından veriler çekiliyor...</p>
    </div>

    <script>
        const apiUrl = 'https://blogicode-ai.vercel.app/api';
        const userId = localStorage.getItem('userId');
        const navActions = document.getElementById('navActions');

        // Navbar'ı Dinamik Olarak Yönetme
        if (userId) {
            // Kullanıcı Giriş Yapmışsa -> Profil Resmini ve Panele Git Butonunu Göster
            // (Profil resmi yoksa rastgele teknolojik bir avatar üretir)
            const picUrl = 'https://api.dicebear.com/7.x/avataaars/svg?seed=' + userId;
            navActions.innerHTML = `
                <button class="btn-login" style="background: #475569;" onclick="window.location.href='home.html'">Paneline Dön</button>
                <img src="${picUrl}" class="profile-pic" onclick="window.location.href='profile.html'" title="Profilime Git">
            `;
        } else {
            // Kullanıcı Ziyaretçiyse -> Giriş Yap Butonunu Göster
            navActions.innerHTML = `
                <button class="btn-login" onclick="window.location.href='login.html'">Giriş Yap / Kayıt Ol</button>
            `;
        }

        // Ana Sayfadaki Yazıları Çekme
        window.onload = async () => {
            const feedDiv = document.getElementById('publicFeed');
            try {
                const response = await fetch(apiUrl + '/posts');
                const result = await response.json();
                
                if (result.data.length === 0) {
                    feedDiv.innerHTML = '<p>Henüz hiç yazı paylaşılmamış. İlki sen ol!</p>';
                    return;
                }

                feedDiv.innerHTML = '<h3 style="color: #f8fafc; margin-bottom: 25px; border-bottom: 2px solid #3b82f6; padding-bottom: 10px; display: inline-block;">🔥 En Güncel Akış</h3>';

                result.data.forEach(post => {
                    const date = new Date(post.createdAt).toLocaleDateString('tr-TR');
                    
                    // Arayüzün dolu ve profesyonel gözükmesi için simüle edilmiş istatistikler
                    const randomLikes = Math.floor(Math.random() * 140) + 12;
                    const randomFavs = Math.floor(Math.random() * 40) + 3;
                    const randomComments = Math.floor(Math.random() * 25) + 2;

                    feedDiv.innerHTML += `
                        <div class="post-card">
                            <div class="post-header">
                                <span>Anonim Yazar</span>
                                <span>🗓️ ${date}</span>
                            </div>
                            <h3 class="post-title">${post.title}</h3>
                            <span class="post-category">${post.category || 'Genel'}</span>
                            <div class="post-content">${post.content}</div>
                            
                            <div class="post-stats">
                                <div class="stat-item" onclick="islemYap()">❤️ ${randomLikes}</div>
                                <div class="stat-item" onclick="islemYap()">⭐ ${randomFavs}</div>
                                <div class="stat-item" onclick="islemYap()">💬 ${randomComments}</div>
                            </div>
                            
                            <div class="comment-fake">
                                <span>Görüşlerini bildirmek veya yorumlara katılmak ister misin?</span>
                                <button onclick="islemYap()">Giriş Yap</button>
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                feedDiv.innerHTML = '<p style="color:red;">Sunucuya bağlanılamadı. Lütfen daha sonra tekrar deneyin.</p>';
            }
        };

        // Yönlendirme Fonksiyonu (Eyleme göre filtreler)
        function islemYap() {
            if (userId) {
                // Giriş yapmışsa kendi paneline at
                window.location.href = 'home.html';
            } else {
                // Giriş yapmamışsa login ekranına at
                window.location.href = 'login.html';
            }
        }
    </script>
</body>
</html>
